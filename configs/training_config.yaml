# Kept byte-identical to the training_config.yaml embedded in
# k8s/configmap.yaml, so a container behaves the same whether the config comes
# from the image (docker run) or from the mounted ConfigMap (kubectl apply).
model:
  architecture: simple_cnn
  num_classes: 10

training:
  epochs: 10
  batch_size: 64
  learning_rate: 0.001
  early_stopping_patience: 3

data:
  dataset: cifar10
  data_dir: /app/data

output:
  checkpoint_dir: /app/checkpoints
  model_name: classifier_v1.pt
