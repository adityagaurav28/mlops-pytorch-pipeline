apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-data-pvc
  namespace: ml-training
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-checkpoints-pvc
  namespace: ml-training
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
