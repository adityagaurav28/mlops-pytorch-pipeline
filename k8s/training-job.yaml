apiVersion: batch/v1
kind: Job
metadata:
  name: training-job
  namespace: ml-training
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_PATH
              value: /app/configs/training_config.yaml
          volumeMounts:
            - name: config
              mountPath: /app/configs
            - name: data
              mountPath: /app/data
            - name: checkpoints
              mountPath: /app/checkpoints
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: config
          configMap:
            name: training-config
        - name: data
          persistentVolumeClaim:
            claimName: ml-data-pvc
        - name: checkpoints
          persistentVolumeClaim:
            claimName: ml-checkpoints-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi